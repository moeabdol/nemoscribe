[project]
name = "nemoscribe"
version = "0.1.0"
description = "Multi-lingual CLI transcriber (batch + live streaming) built on NVIDIA Nemotron 3.5 ASR"
requires-python = ">=3.12"
dependencies = ["torch>=2.13", "transformers>=5.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]
